services:
  postgres:
    image: postgres:16
    container_name: muflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: muflow
      POSTGRES_USER: muflow
      POSTGRES_PASSWORD: muflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
